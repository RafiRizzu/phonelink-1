<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PhoneLink Controller</title>
<style>
  :root{
    --bg1:#0f0c29; --bg2:#302b63; --bg3:#24243e;
    --accent:#00d4ff; --accent2:#7b2ff7; --ok:#2ee6a6; --bad:#ff5577;
    --panel:rgba(255,255,255,0.06); --panelBorder:rgba(255,255,255,0.12);
  }
  *{box-sizing:border-box}
  body{
    margin:0;min-height:100vh;color:#eee;
    font:14px/1.4 system-ui,sans-serif;
    background:
      radial-gradient(circle at 10% 10%, rgba(0,212,255,.25), transparent 40%),
      radial-gradient(circle at 90% 20%, rgba(123,47,247,.3), transparent 45%),
      radial-gradient(circle at 50% 100%, rgba(46,230,166,.15), transparent 50%),
      linear-gradient(135deg, var(--bg1), var(--bg2) 60%, var(--bg3));
    display:flex;gap:18px;padding:18px;
  }
  #wrap{flex:1;display:flex;justify-content:center;align-items:center;min-width:0;position:relative}
  #frame{
    position:relative;padding:14px 10px;border-radius:36px;
    background:linear-gradient(145deg,#1a1a2e,#0d0d1a);
    box-shadow:0 0 0 2px var(--panelBorder), 0 20px 60px rgba(0,0,0,.5), 0 0 40px rgba(0,212,255,.15);
  }
  #frame::before{
    content:"";position:absolute;top:4px;left:50%;transform:translateX(-50%);
    width:60px;height:6px;border-radius:4px;background:#333;
  }
  canvas{display:block;max-height:78vh;max-width:70vw;background:#000;border-radius:22px;touch-action:none;cursor:pointer}
  #panel{
    width:260px;display:flex;flex-direction:column;gap:10px;
    background:var(--panel);border:1px solid var(--panelBorder);border-radius:18px;
    padding:18px;backdrop-filter:blur(10px);box-shadow:0 10px 30px rgba(0,0,0,.3);
  }
  h1{font-size:18px;margin:0 0 4px;background:linear-gradient(90deg,var(--accent),var(--accent2));
     -webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:.5px}
  input{padding:10px;font:inherit;border-radius:10px;border:1px solid var(--panelBorder);
        background:rgba(0,0,0,.3);color:#eee;outline:none}
  input:focus{border-color:var(--accent)}
  button{
    padding:10px;font:inherit;font-weight:600;cursor:pointer;border-radius:10px;
    border:1px solid var(--panelBorder);background:rgba(255,255,255,.05);color:#eee;
    transition:transform .08s, background .15s, box-shadow .15s;
  }
  button:hover{background:rgba(255,255,255,.12);transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  #go{background:linear-gradient(90deg,var(--accent),var(--accent2));border:none;color:#06101a}
  #go:hover{box-shadow:0 0 18px rgba(0,212,255,.5)}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  #st{display:flex;align-items:center;gap:8px;font-size:13px;color:#aab}
  #dot{width:9px;height:9px;border-radius:50%;background:var(--bad);box-shadow:0 0 8px var(--bad)}
  #dot.on{background:var(--ok);box-shadow:0 0 8px var(--ok)}
  hr{border:none;border-top:1px solid var(--panelBorder);margin:4px 0}
  small{color:#8891a8}
</style>
</head>
<body>
<div id="wrap"><div id="frame"><canvas id="screen" width="540" height="1170"></canvas></div></div>
<div id="panel">
  <h1>⚡ PhoneLink</h1>
  <input id="code" placeholder="Pairing code" maxlength="8" autocomplete="off">
  <button id="go">Connect</button>
  <div id="st"><span id="dot"></span><span id="stText">disconnected</span></div>
  <hr>
  <div class="row">
    <button data-k="back">◀ Back</button>
    <button data-k="home">● Home</button>
    <button data-k="recents">▭ Recents</button>
    <button data-k="notifications">🔔 Notif</button>
    <button data-k="quick">⚙ Quick</button>
    <button data-k="lock">🔒 Lock</button>
  </div>
  <button data-k="screenshot">📸 Screenshot</button>
  <hr>
  <input id="txt" placeholder="Type text, press Enter">
  <button id="bs">⌫ Backspace</button>
  <small>Click = tap · Drag = swipe · Hold 0.5s+ = long press · Keyboard types live</small>
</div>
<script>
const $ = id => document.getElementById(id);
const cv = $('screen'), ctx = cv.getContext('2d');
let ws = null, down = null;

function setStatus(s, on){ $('stText').textContent = s; $('dot').classList.toggle('on', !!on); }
function send(o){ if (ws && ws.readyState === 1) ws.send(JSON.stringify(o)); }

function connect(){
  const code = $('code').value.trim().toUpperCase();
  if (ws) ws.close();
  ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host);
  ws.binaryType = 'blob';
  ws.onopen = () => { ws.send(JSON.stringify({type:'hello', role:'controller', code})); setStatus('waiting for phone...', false); };
  ws.onclose = () => setStatus('disconnected', false);
  ws.onmessage = async e => {
    if (typeof e.data === 'string') {
      const m = JSON.parse(e.data);
      if (m.type === 'info') setStatus(m.online ? ('phone online' + (m.a11y ? '' : ' (accessibility OFF)')) : 'phone offline', m.online);
      return;
    }
    const bmp = await createImageBitmap(e.data);
    if (cv.width !== bmp.width || cv.height !== bmp.height) { cv.width = bmp.width; cv.height = bmp.height; }
    ctx.drawImage(bmp, 0, 0);
    bmp.close();
  };
}

function norm(e){
  const r = cv.getBoundingClientRect();
  return { x: Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)),
           y: Math.min(1, Math.max(0, (e.clientY - r.top) / r.height)) };
}

cv.addEventListener('pointerdown', e => {
  cv.setPointerCapture(e.pointerId);
  down = { ...norm(e), t: performance.now(), cx: e.clientX, cy: e.clientY };
});
cv.addEventListener('pointerup', e => {
  if (!down) return;
  const up = norm(e), dt = performance.now() - down.t;
  const moved = Math.hypot(e.clientX - down.cx, e.clientY - down.cy);
  if (moved < 8) {
    if (dt >= 500) send({t:'swipe', x1:down.x, y1:down.y, x2:down.x, y2:down.y, ms:Math.min(dt, 3000)});
    else send({t:'tap', x:down.x, y:down.y});
  } else {
    send({t:'swipe', x1:down.x, y1:down.y, x2:up.x, y2:up.y, ms:Math.max(100, Math.min(dt, 1500))});
  }
  down = null;
});

$('go').onclick = connect;
document.querySelectorAll('[data-k]').forEach(b => b.onclick = () => send({t:'key', k:b.dataset.k}));
$('bs').onclick = () => send({t:'backspace'});
$('txt').addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.value) { send({t:'text', s:e.target.value}); e.target.value = ''; }
});
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.key === 'Backspace') send({t:'backspace'});
  else if (e.key.length === 1 && !e.ctrlKey && !e.metaKey) send({t:'text', s:e.key});
});
</script>
</body>
</html>
